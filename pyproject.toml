[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decision-gateway"
dynamic = ["version"]
description = "Project-agnostic Jev decision gateway: deterministic facts, small Noul checks, code-side routing."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jev-gateway = "jev_decision_gateway.cli:main"

[tool.setuptools.dynamic]
version = { attr = "jev_decision_gateway.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
